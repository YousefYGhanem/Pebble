# The Microsoft Store version (Pebble Pet, 9PJNR7CT4ZN7): after each Release, the same tag as a Store package (kept
# with the run) and one submission with it and the listing from docs/store/listing.json, when the Partner Center
# secrets exist (docs/RELEASING.md). Also run by hand (Actions → Store release) with a tag, e.g. to send it again.
name: Store release
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The version's tag (v0.5.2)
        required: true
jobs:
  store:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    env:
      PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      # the native helper, the app and the Store package (npm's own shell reads electron-builder's -c option as it is)
      - run: npm run dist:store
      - run: Copy-Item (Get-ChildItem dist/store/*.appx).FullName dist/store/Pebble.msix
      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: dist/store/Pebble.msix
      # one submission: the package, and the listing's text, "what's new" and screenshots
      - if: env.PARTNER_CENTER_CLIENT_ID != ''
        run: ./scripts/store-listing.ps1
        env:
          STORE_PACKAGE: dist/store/Pebble.msix
