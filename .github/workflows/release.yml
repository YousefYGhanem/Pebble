# Push a tag like v0.2.0 (matching "version" in package.json): this builds the installer and publishes it as a GitHub
# Release, which installed copies of Pebble pick up as an update. The browser extension zip is attached to the release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # code signing (build/sign.cjs): empty until you add these secrets, and the build is unsigned
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - if: env.SIGNPATH_API_TOKEN != ''
        run: Install-Module -Name SignPath -Force -Scope CurrentUser
      - run: npm run typecheck
      - run: npm test
      # the draft exists before electron-builder uploads: its parallel uploads otherwise race to create two releases
      # release notes: docs/releases/<tag>.md when it exists, else GitHub's list of changes
      - run: if (Test-Path docs/releases/${{ github.ref_name }}.md) { gh release create ${{ github.ref_name }} --draft --title "Pebble ${{ github.ref_name }}" --notes-file docs/releases/${{ github.ref_name }}.md } else { gh release create ${{ github.ref_name }} --draft --title "Pebble ${{ github.ref_name }}" --generate-notes }
      # builds the native helper (NativeAOT, with Visual Studio's C++ tools on the runner), the app, and the installer
      - run: npm run release
      - run: npm run pack:extensions
      - run: gh release upload ${{ github.ref_name }} (Get-ChildItem dist/extensions/*.zip).FullName
      # published last, so installed copies never see a release without its installer
      - run: gh release edit ${{ github.ref_name }} --draft=false --latest
