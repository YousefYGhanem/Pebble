# The Windows installer (npm run dist → dist/). Per-user, no admin rights. Updates come from GitHub Releases.
appId: dev.pebble.app
productName: Pebble
copyright: Copyright © 2026 Yousef Ghanem
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# next to the app (process.resourcesPath): the native helper and its CLI, the built-in connectors, the browser extension
extraResources:
  - from: native/publish/pebble-native.exe
    to: native/pebble-native.exe
  - from: cli/pebble.cmd
    to: native/pebble.cmd
  - from: plugins
    to: plugins
  - from: extensions/chat
    to: extensions/chat
  # the icons you can choose in Settings (tray and windows)
  - from: build/icons
    to: icons
    filter: ['*.ico']
win:
  target: nsis
  icon: build/icon.ico
  signAndEditExecutable: true
  # signed through SignPath once its secrets are set (build/sign.cjs; unsigned until then, and Windows warns on the
  # first run). Once signed, add publisherName (the certificate's subject) so updates check the signature too.
  signtoolOptions:
    sign: ./build/sign.cjs
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Pebble
  # your settings, themes and outfits stay unless you remove %APPDATA%\Pebble yourself
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  license: LICENSE
publish:
  provider: github
  owner: YousefYGhanem
  repo: Pebble
  releaseType: draft # the release workflow publishes it once everything is uploaded
# The Microsoft Store package (npm run dist:store → dist/*.appx). The Store signs it and keeps it updated, so Pebble's own
# updater stays off there. Fill in the three values from Partner Center → your app → Product identity first
# (docs/STORES.md lists what is still to do before the first upload).
appx:
  # identityName: 12345YousefGhanem.Pebble
  # publisher: CN=XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
  # publisherDisplayName: Yousef Ghanem
  displayName: Pebble
  applicationId: Pebble
  backgroundColor: transparent
  languages: [en-US, ar]
  # Settings → Start with Windows (a packaged app cannot add itself to the Run key)
  addAutoLaunchExtension: true
