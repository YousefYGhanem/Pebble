# The Windows installer (npm run dist → dist/). Per-user, no admin rights. Updates come from GitHub Releases.
appId: dev.pebble.app
productName: Pebble
copyright: Copyright © 2026 Yousef Ghanem
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# next to the app (process.resourcesPath): the native helper and its CLI, the built-in connectors, the browser extension
extraResources:
  - from: native/publish/pebble-native.exe
    to: native/pebble-native.exe
  - from: cli/pebble.cmd
    to: native/pebble.cmd
  - from: plugins
    to: plugins
  - from: extensions/chat
    to: extensions/chat
  # the icons you can choose in Settings (tray and windows)
  - from: build/icons
    to: icons
    filter: ['*.ico']
win:
  target: nsis
  icon: build/icon.ico
  signAndEditExecutable: true
  # signed through SignPath once its secrets are set (build/sign.cjs; unsigned until then, and Windows warns on the
  # first run). Once signed, add publisherName (the certificate's subject) so updates check the signature too.
  signtoolOptions:
    sign: ./build/sign.cjs
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Pebble
  # your settings, themes and outfits stay unless you remove %APPDATA%\Pebble yourself
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  license: LICENSE
publish:
  provider: github
  owner: YousefYGhanem
  repo: Pebble
  releaseType: draft # the release workflow publishes it once everything is uploaded
# The Microsoft Store package (npm run dist:store → dist/store/*.appx, apart from the running dist/win-unpacked). The Store signs it and keeps it updated, so Pebble's own
# updater stays off there. See docs/STORES.md before an upload.
appx:
  # from Partner Center → Pebble → Product identity
  identityName: YousefGhanem.PebblePet
  publisher: CN=75D4754E-F120-440E-A79A-0581F3A0BAAE
  publisherDisplayName: Yousef Ghanem
  # agents outside the package must see Pebble's real files in %APPDATA% (docs/STORES.md)
  customManifestPath: appxmanifest.xml
  capabilities: [runFullTrust, unvirtualizedResources]
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.26100.0
  displayName: Pebble Pet # the name reserved in Partner Center ("Pebble" was taken); the Store requires an exact match
  applicationId: Pebble
  backgroundColor: transparent
  languages: [en-US, ar]
  # Settings → Start with Windows (a packaged app cannot add itself to the Run key)
  addAutoLaunchExtension: true
