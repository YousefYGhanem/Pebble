<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; margin: 0; padding: 14px; font: 13px 'Segoe UI', sans-serif; background: #0d0d12; color: #f3f3f6; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { color: #8b8b98; margin: 0 0 12px; }
    label { display: block; margin: 8px 0 4px; }
    input { box-sizing: border-box; width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid #ffffff22; background: #1a1a22; color: inherit; font: inherit; }
    button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #7c5cff; color: #fff; font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid #7c5cff; outline-offset: 2px; }
    #status { margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
  <h1>Pebble</h1>
  <p>Copy the key from Pebble: Settings → Pip's chat → Chat apps.</p>
  <label for="key">Pairing key</label>
  <input id="key" autocomplete="off" spellcheck="false">
  <label for="port">Port</label>
  <input id="port" type="number" min="1024" max="65535" value="47901">
  <button id="save">Save and test</button>
  <div id="status" role="status"></div>
  <p style="margin-top:12px;font-size:11px">Experimental: the chat sites' terms may not allow automated access. Use at your own risk. Not affiliated with Anthropic, OpenAI, Google or DeepSeek.</p>
  <script src="popup.js"></script>
</body>
</html>
